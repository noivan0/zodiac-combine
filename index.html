<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>애들아 다들 이거 합쳐봐 ㅈㄴ세짐 | 띠+별자리 합체 생성기</title>
  <meta name="description" content="생년월일 입력하면 음력 기준 정확한 띠와 별자리를 합쳐서 개쎄다 조합 만들어줌. 전갈토끼">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.5/lunar.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF8F0;
      --card: #FFFFFF;
      --text: #111111;
      --border: #000000;
      --pink: #FF2D55;
      --yellow: #FFE600;
      --blue: #00B4FF;
      --lime: #B8FF3C;
      --purple: #9B5CFF;
      --shadow: 6px 6px 0 #000000;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(0,0,0,0.03) 19px, rgba(0,0,0,0.03) 20px),
        repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(0,0,0,0.03) 19px, rgba(0,0,0,0.03) 20px);
    }
    .container { max-width: 480px; width: 100%; }
    header { text-align: center; margin-bottom: 28px; }
    h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.1rem;
      line-height: 1.25;
      letter-spacing: -1px;
      color: var(--text);
      text-shadow: 3px 3px 0 var(--yellow);
      margin-bottom: 10px;
    }
    .subtitle {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      background: var(--pink);
      color: #fff;
      display: inline-block;
      padding: 6px 12px;
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--border);
      margin-bottom: 8px;
    }
    .card {
      background: var(--card);
      border: 4px solid var(--border);
      box-shadow: var(--shadow);
      padding: 24px 20px;
      overflow: hidden;
    }
    label {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .date-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 8px;
      width: 100%;
    }
    .date-row select {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding: 12px 8px;
      font-size: 1rem;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      border: 4px solid var(--border);
      background: #fff;
      color: var(--text);
      outline: none;
      box-shadow: 3px 3px 0 var(--border);
      box-sizing: border-box;
      cursor: pointer;
      appearance: auto;
      -webkit-appearance: menulist;
    }
    .date-row select:focus { background: var(--yellow); }
    .btn {
      width: 100%;
      padding: 16px;
      margin-top: 16px;
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.3rem;
      border: 4px solid var(--border);
      background: var(--pink);
      color: #fff;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--border);
      transition: transform 0.1s, box-shadow 0.1s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--border); }
    .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--border); }
    #result {
      display: none;
      margin-top: 28px;
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .result-card {
      background: var(--yellow);
      border: 4px solid var(--border);
      box-shadow: var(--shadow);
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .combo-name {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.4rem;
      line-height: 1.15;
      letter-spacing: -1.5px;
      color: #000;
      margin-bottom: 4px;
    }
    .combo-sub {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      background: #000;
      color: #fff;
      display: inline-block;
      padding: 4px 10px;
      margin-top: 4px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    .info-item {
      background: #fff;
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--border);
      padding: 12px 8px;
      text-align: center;
    }
    .info-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: #555;
    }
    .info-value {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.25rem;
      color: #000;
    }
    .desc-box {
      background: #fff;
      border: 4px solid var(--border);
      box-shadow: 4px 4px 0 var(--border);
      padding: 16px;
      margin: 16px 0;
      font-size: 0.95rem;
      line-height: 1.65;
      text-align: left;
      white-space: pre-line;
    }
    .desc-box strong {
      background: var(--lime);
      padding: 0 4px;
      border: 1px solid #000;
    }
    .branding {
      background: var(--blue);
      border: 4px solid var(--border);
      box-shadow: 4px 4px 0 var(--border);
      padding: 16px;
      text-align: center;
      color: #000;
    }
    .branding-title {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .branding-text {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.25rem;
      line-height: 1.3;
    }
    .share-btn { background: var(--lime); color: #000; margin-top: 16px; }
    .disclaimer {
      margin-top: 28px;
      font-size: 0.72rem;
      line-height: 1.5;
      text-align: center;
      color: #444;
      font-family: 'Space Mono', monospace;
    }
    footer {
      margin-top: 32px;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
    }
    footer a {
      color: var(--pink);
      text-decoration: none;
      border-bottom: 2px solid var(--pink);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>애들아 다들<br>이거 합쳐봐<br>ㅈㄴ세짐</h1>
      <p class="subtitle">본인 별자리 + 띠 합치면 개쎄다</p>
    </header>

    <div class="card">
      <div class="input-section">
        <label>생년월일 입력</label>
        <div class="date-row">
          <select id="birthYear" aria-label="년"></select>
          <select id="birthMonth" aria-label="월"></select>
          <select id="birthDay" aria-label="일"></select>
        </div>
        <button class="btn" onclick="calculate()">합쳐보기</button>
      </div>

      <div id="result">
        <div class="result-card">
          <div class="combo-name" id="comboName">전갈토끼</div>
          <div class="combo-sub" id="comboSub">전갈자리 × 토끼띠</div>
        </div>

        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">별자리</div>
            <div class="info-value" id="signResult">전갈자리</div>
          </div>
          <div class="info-item">
            <div class="info-label">띠 (음력)</div>
            <div class="info-value" id="animalResult">토끼띠</div>
          </div>
        </div>

        <div class="desc-box" id="description"></div>

        <div class="branding">
          <div class="branding-title">캐릭터 브랜딩</div>
          <div class="branding-text" id="brandText">독기 품은 귀요미 전갈토끼</div>
        </div>

        <button class="btn share-btn" onclick="shareResult()">결과 공유하기</button>
      </div>
    </div>

    <p class="disclaimer">
      ※ 띠는 음력(설날) 기준으로 정확하게 계산됩니다.<br>
      별자리 경계일(커스프)은 출생 시간에 따라 다를 수 있음.<br>
      순수 재미용 · 144개 조합 전부 지원
    </p>

    <footer>
      MADE FOR FUN · <a href="https://github.com/noivan0" target="_blank">GITHUB PAGES OK</a>
    </footer>
  </div>

  <script>
    const animalMap = {
      "Rat": "쥐", "Ox": "소", "Tiger": "호랑이", "Rabbit": "토끼",
      "Dragon": "용", "Snake": "뱀", "Horse": "말", "Goat": "양", "Sheep": "양",
      "Monkey": "원숭이", "Rooster": "닭", "Dog": "개", "Pig": "돼지",
      "鼠": "쥐", "牛": "소", "虎": "호랑이", "兔": "토끼",
      "龙": "용", "蛇": "뱀", "马": "말", "羊": "양",
      "猴": "원숭이", "鸡": "닭", "狗": "개", "猪": "돼지",
      "龍": "용", "馬": "말", "雞": "닭", "豬": "돼지"
    };

    const animalTraits = {
      "쥐": ["눈치백단", "야근요정", "정보왕", "기회주의자", "재빠른손"],
      "소": ["묵묵보스", "성실머신", "뚝심왕", "느긋한거인", "일중독"],
      "호랑이": ["카리스마폭주", "리더본능", "독립전사", "카리스마폭발", "정글킹"],
      "토끼": ["귀요미방패", "섬세감성", "평화주의자", "조심보", "힐링요정"],
      "용": ["스케일킹", "야망폭발", "행운캐리", "드레이곤모드", "왕기충만"],
      "뱀": ["전략천재", "신비주의", "통찰레이더", "조용한독기", "계산왕"],
      "말": ["자유본능", "에너지폭주", "모험러버", "질주본능", "낙천러너"],
      "양": ["예술혼", "배려천사", "감성폭발", "온순보스", "힐링아티스트"],
      "원숭이": ["재치폭격", "유머폭탄", "호기심폭발", "다재다능", "장난꾸러기"],
      "닭": ["완벽주의", "자신감뿜뿜", "꼼꼼레이더", "성실요정", "디테일킹"],
      "개": ["충성보스", "정의구현", "보호본능MAX", "정직한친구", "개찐친"],
      "돼지": ["낙천폭발", "관대마스터", "풍요요정", "솔직담백", "행복바이러스"]
    };

    const signs = [
      { name: "물병자리", startM: 1, startD: 20, endM: 2, endD: 18, traits: ["미래지향", "독창폭주", "자유영혼", "인디비주얼", "실험정신"] },
      { name: "물고기자리", startM: 2, startD: 19, endM: 3, endD: 20, traits: ["몽환감성", "공감레이더", "상상력MAX", "힐링바다", "감성폭발"] },
      { name: "양자리", startM: 3, startD: 21, endM: 4, endD: 19, traits: ["돌진본능", "열정폭주", "솔직화염", "도전러버", "불꽃리더"] },
      { name: "황소자리", startM: 4, startD: 20, endM: 5, endD: 20, traits: ["안정요새", "감각미식", "끈기보스", "신뢰벽돌", "느긋럭셔리"] },
      { name: "쌍둥이자리", startM: 5, startD: 21, endM: 6, endD: 21, traits: ["재빠른입", "호기심폭발", "다재다능", "수다폭탄", "정보수집가"] },
      { name: "게자리", startM: 6, startD: 22, endM: 7, endD: 22, traits: ["보호갑옷", "감정레이더", "집순이본능", "직관폭발", "케어천사"] },
      { name: "사자자리", startM: 7, startD: 23, endM: 8, endD: 22, traits: ["무대본능", "카리스마태양", "자신감MAX", "관대왕", "스포트라이트"] },
      { name: "처녀자리", startM: 8, startD: 23, endM: 9, endD: 22, traits: ["분석레이더", "완벽주의", "실용보스", "디테일집착", "정리의신"] },
      { name: "천칭자리", startM: 9, startD: 23, endM: 10, endD: 22, traits: ["조화마법", "매력폭발", "공정저울", "사교천재", "미학러버"] },
      { name: "전갈자리", startM: 10, startD: 23, endM: 11, endD: 21, traits: ["강렬독기", "신비심연", "집중레이저", "열정흑염", "통찰독수리"] },
      { name: "사수자리", startM: 11, startD: 22, endM: 12, endD: 21, traits: ["모험질주", "낙천화살", "솔직직구", "자유여행자", "철학러버"] },
      { name: "염소자리", startM: 12, startD: 22, endM: 1, endD: 19, traits: ["야망등반", "책임요새", "인내보스", "현실주의", "성공집착"] }
    ];

    function hashCode(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
      }
      return Math.abs(h);
    }
    function pickBySeed(arr, seed) { return arr[seed % arr.length]; }

    function getChineseZodiacAccurate(year, month, day) {
      try {
        if (typeof Solar === 'undefined') return fallbackChinese(year);
        const solar = Solar.fromYmd(year, month, day);
        const lunar = solar.getLunar();
        const raw = lunar.getAnimal();
        const mapped = animalMap[raw];
        if (mapped) return mapped;
        const korean = ["쥐","소","호랑이","토끼","용","뱀","말","양","원숭이","닭","개","돼지"];
        if (korean.includes(raw)) return raw;
        return fallbackChinese(year);
      } catch (e) {
        return fallbackChinese(year);
      }
    }

    function fallbackChinese(year) {
      const a = ["쥐", "소", "호랑이", "토끼", "용", "뱀", "말", "양", "원숭이", "닭", "개", "돼지"];
      return a[(year - 1900) % 12];
    }

    function getWesternZodiac(month, day) {
      for (let s of signs) {
        if (s.startM < s.endM) {
          if ((month === s.startM && day >= s.startD) || (month === s.endM && day <= s.endD) || (month > s.startM && month < s.endM)) return s;
        } else {
          if ((month === s.startM && day >= s.startD) || (month === s.endM && day <= s.endD)) return s;
        }
      }
      return signs[0];
    }

    function generateDescription(sign, animal, combo) {
      const seed = hashCode(combo);
      const sTrait = pickBySeed(sign.traits, seed);
      const aTrait = pickBySeed(animalTraits[animal] || ["특별한"], seed + 7);
      const templates = [
        `와... <strong>${combo}</strong>?\n\n${sign.name}의 ${sTrait} + ${animal}띠의 ${aTrait}이 합쳐진 결과.\n\n이 조합은 그냥 사는 게 아니라 \"존재 자체가 콘텐츠\"인 타입. 옆에만 있어도 스토리가 생긴다.`,
        `<strong>${combo}</strong> 등장.\n\n${sTrait}한 에너지로 분위기 장악하고, ${aTrait} 본능으로 상황을 요리하는 사람.\n\n한마디로 말하면... 개쎄다. 진짜로.`,
        `<strong>${combo}</strong>\n\n겉으로는 ${aTrait}, 속으로는 ${sTrait}.\n이 갭이 매력 포인트. 한 번 보면 기억에 남는 타입.`,
        `본인 별자리+띠 합치면 진짜 개쎄다 소리 나오는 이유가 이거임.\n\n<strong>${combo}</strong>는 ${sTrait}하면서도 ${aTrait}한 면이 공존해서, 예측 불가능한 바이브를 풍긴다.`,
        `${animal}띠의 ${aTrait}이 ${sign.name} ${sTrait}와 만나면?\n\n답: <strong>${combo}</strong>.\n\n일상에서도 눈에 띄고, 모임에서도 존재감 있는 캐릭터. 이 조합 가진 사람 특: 그냥 있어도 재밌음.`,
        `경고: <strong>${combo}</strong>는 평범함과 거리가 멀다.\n\n${sTrait} 모드 켰다 하면 분위기 장악, ${aTrait} 모드 켜면 사람 홀린다.\n이 조합은 그냥 태어난 게 아니라 기획된 느낌.`
      ];
      return pickBySeed(templates, seed);
    }

    function generateBrand(sign, animal, combo) {
      const seed = hashCode(combo + "brand");
      const sTrait = pickBySeed(sign.traits, seed);
      const aTrait = pickBySeed(animalTraits[animal] || ["특별한"], seed + 3);
      const brands = [
        `${sTrait} × ${aTrait}의 최종 진화형`,
        `독기 품은 ${combo} 공식 캐릭터`,
        `${combo} — 존재 자체가 개쎄다`,
        `${aTrait} 매력의 ${combo} 완성체`,
        `${combo} 한정판`,
        `개쎄다 인증: ${combo}`,
        `${sTrait} 영혼 + ${aTrait} 본능 = ${combo}`
      ];
      return pickBySeed(brands, seed);
    }

    function calculate() {
      const year = parseInt(document.getElementById('birthYear').value, 10);
      const month = parseInt(document.getElementById('birthMonth').value, 10);
      const day = parseInt(document.getElementById('birthDay').value, 10);
      if (!year || !month || !day) {
        alert('생년월일을 모두 선택해주세요!');
        return;
      }

      const animal = getChineseZodiacAccurate(year, month, day);
      const sign = getWesternZodiac(month, day);
      const signShort = sign.name.replace('자리', '');
      const combo = signShort + animal;

      document.getElementById('comboName').textContent = combo;
      document.getElementById('comboSub').textContent = `${sign.name} × ${animal}띠`;
      document.getElementById('signResult').textContent = sign.name;
      document.getElementById('animalResult').textContent = animal + '띠';
      document.getElementById('description').innerHTML = generateDescription(sign, animal, combo);
      document.getElementById('brandText').textContent = generateBrand(sign, animal, combo);

      document.getElementById('result').style.display = 'block';
      document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function shareResult() {
      const combo = document.getElementById('comboName').textContent;
      const text = `나의 합체 결과는 ${combo}\n애들아 다들 이거 합쳐봐 ㅈㄴ세짐\n`;
      if (navigator.share) {
        navigator.share({ title: '띠+별자리 합체', text: text });
      } else {
        navigator.clipboard.writeText(text + (window.location.href || '')).then(() => {
          alert('결과가 클립보드에 복사되었습니다!');
        });
      }
    }

    function daysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function fillDays() {
      const y = parseInt(document.getElementById('birthYear').value, 10);
      const m = parseInt(document.getElementById('birthMonth').value, 10);
      const daySel = document.getElementById('birthDay');
      const prev = parseInt(daySel.value, 10) || 1;
      const max = daysInMonth(y, m);
      daySel.innerHTML = '';
      for (let d = 1; d <= max; d++) {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d + '일';
        daySel.appendChild(opt);
      }
      daySel.value = String(Math.min(prev, max));
    }

    function initDateSelects() {
      const yearSel = document.getElementById('birthYear');
      const monthSel = document.getElementById('birthMonth');
      const now = new Date().getFullYear();
      yearSel.innerHTML = '';
      for (let y = now; y >= 1920; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + '년';
        yearSel.appendChild(opt);
      }
      yearSel.value = '2000';
      monthSel.innerHTML = '';
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m + '월';
        monthSel.appendChild(opt);
      }
      monthSel.value = '1';
      fillDays();
      yearSel.addEventListener('change', fillDays);
      monthSel.addEventListener('change', fillDays);
    }

    initDateSelects();
  </script>
</body>
</html>
